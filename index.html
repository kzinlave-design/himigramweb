<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himigram Desktop</title>
  <style>
    :root {
      --bg-main: #0f1821;
      --bg-sidebar: #17212b;
      --bg-chat: #0e1621;
      --bg-msg-in: #182533;
      --bg-msg-out: #2b5278;
      --accent: #5288c1;
      --accent-hover: #649ad5;
      --text: #f5f5f5;
      --text-muted: #7f91a4;
      --border: #242f3d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

    /* --- Анимации --- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flyPaperPlane {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
      40% { transform: scale(1.1) translate(-10px, 10px) rotate(-10deg); opacity: 1; }
      100% { transform: scale(0.3) translate(300px, -300px) rotate(25deg); opacity: 0; }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(82, 136, 193, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(82, 136, 193, 0); }
      100% { box-shadow: 0 0 0 0 rgba(82, 136, 193, 0); }
    }

    /* Экран Авторизации */
    #auth-screen {
      position: fixed; inset: 0; background: var(--bg-main); z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .auth-card {
      background: var(--bg-sidebar); width: 380px; padding: 40px 30px; border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5); text-align: center; border: 1px solid var(--border);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Контейнер под официальный Lottie-самолетик */
    #lottie-plane {
      width: 120px; height: 120px; margin: 0 auto 10px auto;
      transition: transform 0.3s ease; cursor: pointer;
    }
    #lottie-plane.flying {
      animation: flyPaperPlane 0.8s forwards ease-in-out;
    }

    .auth-card h2 { font-size: 22px; margin-bottom: 8px; font-weight: 600; }
    .auth-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.4; }

    .auth-input {
      width: 100%; padding: 12px 14px; background: var(--bg-main); border: 1px solid var(--border);
      border-radius: 10px; color: #fff; margin-bottom: 12px; outline: none; font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(82, 136, 193, 0.2); }

    .btn-primary {
      width: 100%; padding: 12px; background: var(--accent); color: white; border: none;
      border-radius: 10px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.98); }

    /* Главный Интерфейс */
    #app { display: flex; width: 100vw; height: 100vh; opacity: 1; transition: opacity 0.3s ease; }

    /* Sidebar */
    #sidebar { width: 320px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 14px 16px; background: var(--bg-sidebar); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    
    .nav-tabs { display: flex; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 13px; transition: color 0.2s; position: relative; }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--accent);
      animation: fadeIn 0.2s ease;
    }

    #dialogs-list { flex: 1; overflow-y: auto; }
    .dialog-item {
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
    }
    .dialog-item:hover { background: rgba(255,255,255,0.05); }

    /* Chat Area */
    #chat-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
    #chat-header { padding: 14px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); font-weight: bold; }

    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg {
      max-width: 65%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4;
      word-break: break-word; animation: fadeIn 0.25s cubic-bezier(0, 0, 0.2, 1);
    }
    .msg.in { background: var(--bg-msg-in); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.out { background: var(--bg-msg-out); align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 4px; }
    .msg audio { width: 220px; margin-top: 4px; }

    /* Input Area */
    #input-area { padding: 12px 16px; background: var(--bg-sidebar); display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--border); }
    #message-input { flex: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-main); color: #fff; outline: none; transition: border-color 0.2s; }
    #message-input:focus { border-color: var(--accent); }
    .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 6px; transition: color 0.2s, transform 0.1s; }
    .icon-btn:hover { color: var(--accent); transform: scale(1.1); }
    .icon-btn:active { transform: scale(0.95); }

    .recording { animation: pulseGlow 1.5s infinite; border-radius: 50%; color: #ef4444 !important; }

    /* Himigram Settings Tab */
    .view-panel { padding: 16px; display: none; flex-direction: column; gap: 12px; animation: fadeIn 0.2s ease; }
    .view-panel.active { display: flex; }
    .feature-card { background: var(--bg-main); padding: 14px; border-radius: 10px; border: 1px solid var(--border); }
    .feature-card h4 { color: var(--accent); margin-bottom: 6px; font-size: 14px; }
  </style>

  <!-- Lottie Player для официальной векторной анимации Telegram -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <!-- GramJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/telegram@latest/browser/gramjs.js"></script>
</head>
<body>

  <!-- Экран Входа -->
  <div id="auth-screen">
    <div class="auth-card">
      <!-- Официальный Lottie-контейнер Telegram Paper Plane -->
      <div id="lottie-plane"></div>

      <h2>Вход в Himigram</h2>
      <p>Введите API ID, API Hash и номер телефона для авторизации</p>
      
      <input type="text" id="api-id" class="auth-input" placeholder="API ID">
      <input type="text" id="api-hash" class="auth-input" placeholder="API Hash">
      <input type="text" id="phone" class="auth-input" placeholder="+7XXXXXXXXXX">
      <button class="btn-primary" id="send-code-btn" onclick="sendCode()">
        <span id="btn-text">Продолжить</span>
      </button>

      <div id="code-block" style="display:none; margin-top: 12px; animation: fadeIn 0.3s ease;">
        <input type="text" id="phone-code" class="auth-input" placeholder="Код из Telegram">
        <button class="btn-primary" onclick="login()">Войти в аккаунт</button>
      </div>
    </div>
  </div>

  <!-- Главное Окно -->
  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span>Himigram Desktop</span>
        <span id="status-badge" style="font-size: 11px; color: #ef4444;">Offline</span>
      </div>

      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('chats')">Чаты</button>
        <button class="tab-btn" onclick="switchTab('settings')">Himigram</button>
      </div>

      <div id="tab-chats" class="view-panel active" style="padding:0;">
        <div id="dialogs-list"></div>
      </div>

      <div id="tab-settings" class="view-panel">
        <h3>⚡ Himigram Features</h3>
        <div class="feature-card">
          <h4>Ghost Mode</h4>
          <label><input type="checkbox" id="ghost-mode"> Не отправлять «Прочитано»</label>
        </div>
        <div class="feature-card">
          <h4>Автоответчик</h4>
          <label><input type="checkbox" id="auto-reply"> Включить автоответ</label>
          <input type="text" id="auto-reply-text" class="auth-input" value="Отвечу позже (Sent via Himigram)" style="margin-top:6px;">
        </div>
        <button class="btn-primary" onclick="logout()" style="background:#ef4444;">Выйти из аккаунта</button>
      </div>
    </div>

    <!-- Чат -->
    <div id="chat-container">
      <div id="chat-header">Выберите чат</div>
      <div id="messages"></div>
      
      <div id="input-area">
        <input type="file" id="file-input" style="display:none;" onchange="sendFile(this.files[0])">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
        
        <input type="text" id="message-input" placeholder="Напишите сообщение..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
        
        <button class="icon-btn" id="record-btn" onclick="toggleRecord()">🎙️</button>
        <button class="icon-btn" id="send-btn" onclick="sendMessage()" disabled>➔</button>
      </div>
    </div>
  </div>

  <script>
    const { TelegramClient, Api } = window.telegram;
    const { StringSession } = window.telegram.sessions;

    let client = null;
    let activePeer = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let planeAnimation = null;

    // Инициализация официального Lottie-самолетика Telegram
    window.addEventListener('DOMContentLoaded', () => {
      planeAnimation = lottie.loadAnimation({
        container: document.getElementById('lottie-plane'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        // Официальный JSON-анимация самолетика Telegram
        path: 'https://assets2.lottiefiles.com/packages/lf20_TgA2fC.json'
      });

      checkSavedSession();
    });

    async function checkSavedSession() {
      const savedApiId = localStorage.getItem('himigram_api_id');
      const savedApiHash = localStorage.getItem('himigram_api_hash');
      const savedSession = localStorage.getItem('himigram_session') || '';

      if (savedApiId && savedApiHash && savedSession) {
        try {
          client = new TelegramClient(new StringSession(savedSession), parseInt(savedApiId), savedApiHash, { connectionRetries: 5 });
          await client.connect();
          if (await client.checkAuthorization()) {
            hideAuthScreen();
            onSuccessLogin();
          }
        } catch (e) { console.error("Ошибка авто-входа", e); }
      }
    }

    function hideAuthScreen() {
      const plane = document.getElementById('lottie-plane');
      plane.classList.add('flying'); // Запуск анимации улетающего самолетика

      setTimeout(() => {
        const auth = document.getElementById('auth-screen');
        auth.style.opacity = '0';
        auth.style.visibility = 'hidden';
      }, 500);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      if (tab === 'chats') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-chats').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-settings').classList.add('active');
      }
    }

    async function sendCode() {
      const apiId = document.getElementById('api-id').value.trim();
      const apiHash = document.getElementById('api-hash').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!apiId || !apiHash || !phone) return alert('Заполните все поля!');

      document.getElementById('btn-text').innerText = 'Подключение...';

      localStorage.setItem('himigram_api_id', apiId);
      localStorage.setItem('himigram_api_hash', apiHash);

      client = new TelegramClient(new StringSession(''), parseInt(apiId), apiHash, { connectionRetries: 5 });
      await client.connect();

      window.phoneAuth = await client.sendCode({ apiId: parseInt(apiId), apiHash }, phone);
      document.getElementById('code-block').style.display = 'block';
      document.getElementById('btn-text').innerText = 'Код отправлен';
    }

    async function login() {
      const phone = document.getElementById('phone').value.trim();
      const code = document.getElementById('phone-code').value.trim();

      await client.start({ phoneNumber: async () => phone, phoneCode: async () => code });
      localStorage.setItem('himigram_session', client.session.save());

      hideAuthScreen();
      onSuccessLogin();
    }

    function onSuccessLogin() {
      document.getElementById('status-badge').innerText = 'Online';
      document.getElementById('status-badge').style.color = '#22c55e';
      loadDialogs();
      listenMessages();
    }

    async function loadDialogs() {
      const dialogs = await client.getDialogs({});
      const listEl = document.getElementById('dialogs-list');
      listEl.innerHTML = '';

      dialogs.forEach(d => {
        const item = document.createElement('div');
        item.className = 'dialog-item';
        item.innerHTML = `<span>${d.title || d.name || 'Чат'}</span>`;
        item.onclick = () => openChat(d);
        listEl.appendChild(item);
      });
    }

    async function openChat(dialog) {
      activePeer = dialog.entity;
      document.getElementById('chat-header').innerText = dialog.title || dialog.name;
      document.getElementById('message-input').disabled = false;
      document.getElementById('send-btn').disabled = false;

      const messages = await client.getMessages(activePeer, { limit: 30 });
      const msgsEl = document.getElementById('messages');
      msgsEl.innerHTML = '';

      for (let msg of messages.reverse()) {
        await renderMessage(msg);
      }

      if (!document.getElementById('ghost-mode').checked) {
        await client.readHistory(activePeer);
      }
    }

    async function renderMessage(msg) {
      const msgsEl = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${msg.out ? 'out' : 'in'}`;
      
      let html = msg.message || '';

      if (msg.media) {
        if (msg.media.photo) {
          const buffer = await client.downloadMedia(msg.media);
          const blob = new Blob([buffer], { type: 'image/jpeg' });
          html += `<br><img src="${URL.createObjectURL(blob)}">`;
        } else if (msg.media.document) {
          const buffer = await client.downloadMedia(msg.media);
          const blob = new Blob([buffer]);
          const url = URL.createObjectURL(blob);
          if (msg.media.document.mimeType.includes('audio')) {
            html += `<br><audio controls src="${url}"></audio>`;
          } else {
            html += `<br><a href="${url}" download="file" style="color:#38bdf8; text-decoration:none;">📁 Скачать файл</a>`;
          }
        }
      }

      msgDiv.innerHTML = html;
      msgsEl.appendChild(msgDiv);
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activePeer) return;

      const msg = await client.sendMessage(activePeer, { message: text });
      renderMessage(msg);
      input.value = '';
    }

    async function sendFile(file) {
      if (!file || !activePeer) return;
      const toUpload = new CustomFile(file.name, file.size, "", file);
      const uploaded = await client.uploadFile({ file: toUpload, workers: 1 });
      const msg = await client.sendFile(activePeer, { file: uploaded });
      renderMessage(msg);
    }

    async function toggleRecord() {
      const btn = document.getElementById('record-btn');
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
          const file = new File([audioBlob], "voice.ogg", { type: "audio/ogg" });
          sendFile(file);
        };

        mediaRecorder.start();
        btn.classList.add('recording');
      } else {
        mediaRecorder.stop();
        btn.classList.remove('recording');
      }
    }

    function listenMessages() {
      client.addEventHandler(async (event) => {
        const msg = event.message;
        if (document.getElementById('auto-reply').checked && !msg.out && msg.isPrivate) {
          await client.sendMessage(msg.senderId, { message: document.getElementById('auto-reply-text').value });
        }
        if (activePeer && msg.peerId && msg.peerId.userId === activePeer.id) {
          renderMessage(msg);
        }
      });
    }

    async function logout() {
      localStorage.clear();
      location.reload();
    }
  </script>
</body>
</html>
