<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himigram Web</title>

  <!-- Полифил Buffer для работы GramJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js"></script>

  <!-- Библиотека GramJS и QR-генератор -->
  <script src="https://unpkg.com/telegram@2.22.2/browser/gramjs.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #0f1821;
      --bg-card: #17212b;
      --accent: #5288c1;
      --accent-hover: #649ad5;
      --text: #f5f5f5;
      --text-muted: #7f91a4;
      --border: #242f3d;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .auth-container {
      background: var(--bg-card);
      width: 420px;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      border: 1px solid var(--border);
    }

    .tg-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px auto;
      display: block;
      object-fit: contain;
    }

    h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    p.subtext { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }

    .view-mode { display: none; }
    .view-mode.active { display: block; }

    .qr-wrapper {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 0 auto 16px auto;
      background: #ffffff;
      padding: 10px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode canvas, #qrcode img {
      width: 100% !important;
      height: 100% !important;
    }

    .auth-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      margin-bottom: 12px;
      outline: none;
      font-size: 14px;
    }
    .auth-input:focus { border-color: var(--accent); }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }

    .error-box {
      color: var(--danger);
      font-size: 12px;
      background: rgba(239, 68, 68, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
      word-break: break-word;
    }

    .spinner {
      border: 3px solid rgba(0,0,0,0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="auth-container">
    <img src="https://telegram.org/img/t_logo.png" alt="Telegram Logo" class="tg-logo">
    <h2>Himigram Web</h2>
    <p id="subtext" class="subtext">Сканируйте QR-код через Telegram на телефоне</p>

    <div id="error-msg" class="error-box"></div>

    <!-- ВХОД ПО QR -->
    <div id="mode-qr" class="view-mode active">
      <div class="qr-wrapper">
        <div id="qrcode"><div class="spinner"></div></div>
      </div>
      <button class="btn-link" onclick="switchMode('phone')">Войти по номеру телефона / API</button>
    </div>

    <!-- ВХОД ПО НОМЕРУ -->
    <div id="mode-phone" class="view-mode">
      <div id="step-1">
        <input type="text" id="api-id" class="auth-input" placeholder="API ID">
        <input type="text" id="api-hash" class="auth-input" placeholder="API Hash">
        <input type="text" id="phone" class="auth-input" placeholder="Номер телефона (+7...)">
        <button class="btn-primary" id="btn-send-code" onclick="requestCode()">Отправить код</button>
      </div>

      <div id="step-2" style="display:none;">
        <input type="text" id="phone-code" class="auth-input" placeholder="Код из сообщения">
        <button class="btn-primary" id="btn-submit-code" onclick="submitCode()">Подтвердить код</button>
      </div>

      <div id="step-3" style="display:none;">
        <input type="password" id="password-2fa" class="auth-input" placeholder="Облачный пароль (2FA)">
        <button class="btn-primary" id="btn-submit-2fa" onclick="submit2FA()">Войти</button>
      </div>

      <button class="btn-link" onclick="switchMode('qr')">← Вернуться к QR-коду</button>
    </div>
  </div>

  <script>
    // 1. Объявляем глобальные переменные в самом начале файла
    var client = null;
    var phoneCodeHash = null;
    var qrCodeObj = null;

    // Инициализация полифила Buffer
    if (typeof window.Buffer === 'undefined' && window.buffer) {
      window.Buffer = window.buffer.Buffer;
    }

    function getTelegram() {
      return window.telegram || window.gramjs;
    }

    function showError(msg) {
      const box = document.getElementById('error-msg');
      box.innerText = msg;
      box.style.display = 'block';
    }

    function clearError() {
      const box = document.getElementById('error-msg');
      box.style.display = 'none';
      box.innerText = '';
    }

    function switchMode(mode) {
      clearError();
      document.querySelectorAll('.view-mode').forEach(m => m.classList.remove('active'));
      if (mode === 'qr') {
        document.getElementById('mode-qr').classList.add('active');
        document.getElementById('subtext').innerText = 'Сканируйте QR-код через Telegram на телефоне';
        initQRAuth();
      } else {
        document.getElementById('mode-phone').classList.add('active');
        document.getElementById('subtext').innerText = 'Введите API данные и номер телефона';
      }
    }

    // Инициализация/получение экземпляра TelegramClient
    async function initClient(apiId, apiHash) {
      const tg = getTelegram();
      if (!tg) throw new Error("Библиотека GramJS не загрузилась!");

      const { StringSession, TelegramClient } = tg;

      if (!client) {
        client = new TelegramClient(
          new StringSession(''),
          parseInt(apiId),
          apiHash,
          { connectionRetries: 5, useWSS: true }
        );
      }

      if (!client.connected) {
        await client.connect();
      }

      return client;
    }

    // Вход по QR
    async function initQRAuth() {
      const apiId = localStorage.getItem('himigram_api_id') || "2040";
      const apiHash = localStorage.getItem('himigram_api_hash') || "b18441a1ed609e1c87a12a53845487d4";
      const qrContainer = document.getElementById('qrcode');

      try {
        const cli = await initClient(apiId, apiHash);

        await cli.signInWithQrCode({
          apiId: parseInt(apiId),
          apiHash: apiHash,
        }, {
          qrCode: async (qr) => {
            qrContainer.innerHTML = '';
            
            const tokenBase64 = window.Buffer.from(qr.token).toString("base64url");
            const qrUrl = `tg://login?token=${tokenBase64}`;

            if (!qrCodeObj) {
              qrCodeObj = new QRCode(qrContainer, {
                text: qrUrl,
                width: 190,
                height: 190
              });
            } else {
              qrCodeObj.clear();
              qrCodeObj.makeCode(qrUrl);
            }
          },
          password: async (hint) => {
            return prompt(`Введите пароль 2FA (Подсказка: ${hint}):`);
          }
        });

        localStorage.setItem('himigram_session', cli.session.save());
        alert("Вход по QR выполнен успешно!");
      } catch (err) {
        console.error("QR Error:", err);
        showError("Ошибка QR: " + (err.errorMessage || err.message || "Не удалось сгенерировать"));
      }
    }

    // Вход по Номеру
    async function requestCode() {
      clearError();
      const apiId = document.getElementById('api-id').value.trim();
      const apiHash = document.getElementById('api-hash').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!apiId || !apiHash || !phone) return showError('Заполните API ID, API Hash и Телефон!');

      const btn = document.getElementById('btn-send-code');
      btn.disabled = true;
      btn.innerText = 'Отправка...';

      try {
        localStorage.setItem('himigram_api_id', apiId);
        localStorage.setItem('himigram_api_hash', apiHash);

        const cli = await initClient(apiId, apiHash);
        const res = await cli.sendCode({ apiId: parseInt(apiId), apiHash }, phone);

        phoneCodeHash = res.phoneCodeHash;

        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
        document.getElementById('subtext').innerText = `Код отправлен в приложение на номер ${phone}`;
      } catch (err) {
        console.error("Phone Error:", err);
        showError("Ошибка отправки: " + (err.errorMessage || err.message));
        btn.disabled = false;
        btn.innerText = 'Отправить код';
      }
    }

    async function submitCode() {
      clearError();
      const phone = document.getElementById('phone').value.trim();
      const code = document.getElementById('phone-code').value.trim();

      if (!code) return showError('Введите код!');

      const tg = getTelegram();

      try {
        await client.invoke(new tg.Api.auth.SignIn({
          phoneNumber: phone,
          phoneCodeHash: phoneCodeHash,
          phoneCode: code
        }));

        localStorage.setItem('himigram_session', client.session.save());
        alert("Успешный вход!");
      } catch (err) {
        if (err.errorMessage === 'SESSION_PASSWORD_NEEDED') {
          document.getElementById('step-2').style.display = 'none';
          document.getElementById('step-3').style.display = 'block';
        } else {
          showError("Ошибка кода: " + (err.errorMessage || err.message));
        }
      }
    }

    async function submit2FA() {
      clearError();
      const password = document.getElementById('password-2fa').value.trim();
      try {
        await client.signInWithPassword({ password });
        localStorage.setItem('himigram_session', client.session.save());
        alert("Успешный вход!");
      } catch (err) {
        showError("Ошибка 2FA: " + (err.errorMessage || err.message));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initQRAuth();
    });
  </script>
</body>
</html>
