<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himigram Web — Вход по QR</title>

  <!-- Подключаем стилевое оформление и библиотеки -->
  <script src="https://unpkg.com/telegram@2.22.2/browser/gramjs.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #0f1821;
      --bg-card: #17212b;
      --accent: #5288c1;
      --accent-hover: #649ad5;
      --text: #f5f5f5;
      --text-muted: #7f91a4;
      --border: #242f3d;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Карточка авторизации */
    .auth-container {
      background: var(--bg-card);
      width: 420px;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      border: 1px solid var(--border);
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .tg-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px auto;
      display: block;
      object-fit: contain;
    }

    h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    p.subtext { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.4; }

    /* Обертка для QR-кода */
    .qr-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    #qrcode img, #qrcode canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Иконка логотипа по центру QR-кода */
    .qr-center-logo {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .instructions {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .instructions ol {
      padding-left: 18px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(82, 136, 193, 0.08);
      border-color: var(--accent);
    }

    /* Статус/ошибка */
    .status-text {
      font-size: 13px;
      color: var(--accent);
      margin-top: 10px;
    }

    /* Спиннер загрузки */
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <img src="https://telegram.org/img/t_logo.png" alt="Telegram Logo" class="tg-logo">
    <h2>Вход в Himigram Web</h2>
    <p class="subtext">Сканируйте QR-код с помощью Telegram на телефоне</p>

    <!-- Блок с QR-кодом -->
    <div class="qr-wrapper">
      <div id="qrcode">
        <div class="spinner"></div>
      </div>
      <img src="https://telegram.org/img/t_logo.png" class="qr-center-logo" alt="logo">
    </div>

    <!-- Инструкция -->
    <div class="instructions">
      <ol>
        <li>Откройте <b>Telegram</b> на телефоне</li>
        <li>Перейдите в <b>Настройки</b> → <b>Устройства</b></li>
        <li>Нажмите <b>Подключить устройство</b></li>
        <li>Наведите камеру на этот экран</li>
      </ol>
    </div>

    <div id="status" class="status-text">Генерация QR-кода...</div>
    <br>
    <button class="btn-secondary" onclick="usePhoneAuth()">Войти по номеру телефона</button>
  </div>

  <script>
    const tg = window.telegram || window.gramjs;
    const { StringSession } = tg.sessions;
    const { TelegramClient } = tg;

    // Вставь сюда свои API ID и API Hash
    const API_ID = parseInt(localStorage.getItem('himigram_api_id')) || 0;
    const API_HASH = localStorage.getItem('himigram_api_hash') || '';

    let qrCodeObj = null;
    let client = null;

    async function initQRAuth() {
      const statusEl = document.getElementById('status');
      const qrContainer = document.getElementById('qrcode');

      if (!API_ID || !API_HASH) {
        statusEl.innerText = "Ошибка: не найдены API ID и API Hash в localStorage!";
        statusEl.style.color = "var(--danger)";
        return;
      }

      try {
        client = new TelegramClient(new StringSession(''), API_ID, API_HASH, {
          connectionRetries: 5
        });

        await client.connect();
        statusEl.innerText = "Ожидание сканирования...";

        // Запуск встроенной функции GramJS для QR-авторизации
        await client.signInWithQrCode({
          apiId: API_ID,
          apiHash: API_HASH,
        }, {
          qrCode: async (qr) => {
            qrContainer.innerHTML = ''; // Убираем спиннер

            // Токен для QR-кода от Telegram (tg://login?token=...)
            const qrUrl = `tg://login?token=${qr.token.toString("base64url")}`;

            if (!qrCodeObj) {
              qrCodeObj = new QRCode(qrContainer, {
                text: qrUrl,
                width: 196,
                height: 196,
                correctLevel: QRCode.CorrectLevel.L
              });
            } else {
              qrCodeObj.clear();
              qrCodeObj.makeCode(qrUrl);
            }
          },
          password: async (hint) => {
            // Если включена 2FA (Облачный пароль)
            return prompt(`Введите ваш облачный пароль 2FA (Подсказка: ${hint}):`);
          }
        });

        // Успешный вход
        statusEl.innerText = "Авторизация прошла успешно!";
        statusEl.style.color = "#22c55e";
        
        // Сохраняем сессию
        localStorage.setItem('himigram_session', client.session.save());
        
        setTimeout(() => {
          alert("Успешный вход! Сессия сохранена.");
          // window.location.href = 'chat.html';
        }, 1000);

      } catch (err) {
        console.error(err);
        statusEl.innerText = "Ошибка входа: " + (err.errorMessage || err.message);
        statusEl.style.color = "var(--danger)";
      }
    }

    function usePhoneAuth() {
      alert("Переход на форму входа по номеру телефона...");
    }

    window.addEventListener('DOMContentLoaded', initQRAuth);
  </script>
</body>
</html>
